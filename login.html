<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ログイン - WikiHub</title>

<link rel="stylesheet" href="css/login.css">

</head>
<body>

<header>

<div class="logo">
🌐 WikiHub
</div>

</header>

<main>

<div class="registerBox">

<h1>ログイン</h1>

<p class="subtitle">

WikiHubへようこそ

</p>

<label>

ユーザー名

<input
type="text"
id="loginUsername"
placeholder="ユーザー名">

</label>

<label>

パスワード

<input
type="password"
id="loginPassword"
placeholder="パスワード">

</label>

<div class="terms">

<input
type="checkbox"
id="rememberLogin">

<label for="rememberLogin">

ログイン状態を保持する

</label>

</div>

<button id="loginButton">

ログイン

</button>

<hr style="margin:25px 0;">

<div class="links">

<a href="register.html">

アカウントを作成

</a>

</div>

</div>

</main>

<footer>

WikiHub ©2026

</footer>

<script src="js/auth.js"></script>

</body>
</html>
