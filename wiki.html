<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>記事 - WikiHub</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- =================================
     Header
================================= -->

<header id="topBar">

    <div class="logo">
        🌐 WikiHub
    </div>

    <div class="searchArea">

        <input
            type="text"
            id="searchBox"
            placeholder="Wiki・記事を検索..."
        >

        <button id="searchButton">
            🔍
        </button>

    </div>

    <div class="accountArea">

        <button onclick="goWikiPages()">
            📚 記事一覧
        </button>

        <button onclick="goHome()">
            🏠 ホーム
        </button>

    </div>

</header>


<!-- =================================
     Main
================================= -->

<main id="app">


    <!-- =================================
         Left Menu
    ================================= -->

    <aside id="leftMenu">

        <div class="panel">

            <div class="panel-header">
                📚 Wiki
            </div>

            <div class="panel-body">

                <h2 id="wikiTitle">
                    読み込み中...
                </h2>

                <p id="wikiDescription">
                    ---
                </p>

                <hr>

                <button
                    class="btn btn-primary w100"
                    onclick="goWikiPages()">

                    📄 記事一覧

                </button>

                <button
    class="btn btn-secondary w100 mt10"
    onclick="createNewPage()">

    ➕ 新しい記事

</button>
            </div>

        </div>


        <!-- 記事情報 -->

        <div class="panel mt20">

            <div class="panel-header">
                📄 記事情報
            </div>

            <div class="panel-body">

                <p>
                    カテゴリ
                </p>

                <div id="pageCategory">
                    ---
                </div>

                <hr>

                <p>
                    タグ
                </p>

                <div id="pageTags">
                    ---
                </div>

            </div>

        </div>

    </aside>


    <!-- =================================
         Center
    ================================= -->

    <section id="center">


        <!-- Article Header -->

        <div class="welcome">

            <div
                id="pageIcon"
                style="
                    font-size:48px;
                    margin-bottom:10px;
                ">
                📄
            </div>

            <h1 id="pageTitle">
                読み込み中...
            </h1>

            <p id="pageInfo">
                読み込み中...
            </p>

            <div
                id="pageActions"
                style="
                    display:flex;
                    gap:10px;
                    flex-wrap:wrap;
                    margin-top:15px;
                ">

                <button onclick="editCurrentPage()">
                    ✏️ 編集
                </button>

                <button
                    class="btn btn-secondary"
                    onclick="showHistory()">

                    📜 履歴

                </button>

                <button
                    class="btn btn-secondary"
                    onclick="toggleFavorite()">

                    ⭐ お気に入り

                </button>

            </div>

        </div>


        <!-- Article -->

        <div class="panel">

            <div class="panel-body">

                <article
                    id="pageContent"
                    class="article-content">

                    記事を読み込んでいます...

                </article>

            </div>

        </div>


        <!-- Comments -->

        <div class="panel mt20">

            <div class="panel-header">
                💬 コメント
            </div>

            <div class="panel-body">

                <div id="comments">

                    <div class="empty">
                        コメントはまだありません。
                    </div>

                </div>


                <div
                    id="commentForm"
                    style="margin-top:20px;">

                    <textarea
                        id="commentInput"
                        class="textarea"
                        style="min-height:100px;"
                        placeholder="この記事についてコメント...">
                    </textarea>

                    <button
                        class="btn btn-primary mt10"
                        onclick="addComment()">

                        💬 コメント投稿

                    </button>

                </div>

            </div>

        </div>

    </section>


    <!-- =================================
         Right Menu
    ================================= -->

    <aside id="rightMenu">


        <!-- TOC -->

        <div class="panel">

            <div class="panel-header">
                📑 目次
            </div>

            <div
                class="panel-body"
                id="toc">

                目次を生成しています...

            </div>

        </div>


        <!-- Recent -->

        <div class="panel">

            <div class="panel-header">
                📰 最近更新
            </div>

            <div
                class="panel-body"
                id="recentPages">

                読み込み中...

            </div>

        </div>


        <!-- Wiki Stats -->

        <div class="panel">

            <div class="panel-header">
                📊 Wiki情報
            </div>

            <div class="panel-body">

                <p>
                    記事数：
                    <strong id="wikiPages">
                        0
                    </strong>
                </p>

                <p>
                    閲覧数：
                    <strong id="pageViews">
                        0
                    </strong>
                </p>

                <p>
                    ⭐：
                    <strong id="pageStars">
                        0
                    </strong>
                </p>

            </div>

        </div>

    </aside>

</main>


<!-- =================================
     Footer
================================= -->

<footer>

    WikiHub © 2026

</footer>


<!-- =================================
     Scripts
================================= -->

<script src="js/wiki.js"></script>

<script src="js/page-view.js"></script>

</body>

</html>
