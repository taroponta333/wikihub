<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>記事作成 - WikiHub</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="header-left">

<h1>📄 新しい記事</h1>

</div>

<div class="header-right">

<button class="btn btn-secondary"
onclick="history.back()">

戻る

</button>

</div>

</header>

<div id="app">

<!-- 左メニュー -->

<aside id="leftMenu">

<div class="panel">

<div class="panel-header">

記事情報

</div>

<div class="panel-body">

<p>
作成するWiki
</p>

<b id="wikiName">

読み込み中...

</b>

<hr class="mt20 mb20">

<p>

作成者

</p>

<b id="authorName">

---

</b>

</div>

</div>

</aside>

<!-- 中央 -->

<main id="center">

<div class="panel">

<div class="panel-header">

記事作成

</div>

<div class="panel-body">

<div class="form-group">

<label>

タイトル

</label>

<input

id="pageTitle"

class="input"

placeholder="記事タイトル">

</div>

<div class="form-group">

<label>

カテゴリ

</label>

<input

id="pageCategory"

class="input"

placeholder="カテゴリ">

</div>

<div class="form-group">

<label>

タグ

</label>

<input

id="pageTags"

class="input"

placeholder="ゲーム, Java, RPG">

</div>

<div class="form-group">

<label>

記事アイコン

</label>

<input

type="file"

id="pageIcon"

accept="image/*">

</div>

<div class="form-group">

<label>

本文

</label>

<textarea

id="pageContent"

class="textarea"

placeholder="記事を書こう！">

</textarea>

</div>

<div class="space-between">

<button

class="btn btn-secondary"

onclick="previewPage()">

プレビュー

</button>

<div>

<button

class="btn btn-warning"

onclick="saveDraft()">

下書き

</button>

<button

class="btn btn-success"

onclick="publishPage()">

公開

</button>

</div>

</div>

</div>

</div>

</main>

<!-- 右 -->

<aside id="rightMenu">

<div class="panel">

<div class="panel-header">

ヒント

</div>

<div class="panel-body">

<ul>

<li>

📄 タイトルは分かりやすく

</li>

<li>

🏷 タグはカンマ区切り

</li>

<li>

🖼 アイコン設定可能

</li>

<li>

😊 GIFも貼れます

</li>

<li>

📚 Markdown対応予定

</li>

</ul>

</div>

</div>

<div class="panel">

<div class="panel-header">

文字数

</div>

<div class="panel-body">

<h2 id="charCount">

0

</h2>

文字

</div>

</div>

</aside>

</div>

<script src="wiki.js"></script>

<script src="create-page.js"></script>

</body>

</html>
